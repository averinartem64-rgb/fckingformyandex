<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OX CAPITAL</title>
    <style>
        /* Базовый сброс */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;          
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 210px; 
            -webkit-font-smoothing: antialiased;
        }

        /* === КРУГЛАЯ КНОПКА-ТУМБЛЕР === */
        .toggle-circle {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            z-index: 100;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
        }

        /* Состояние ON (зеленый) */
        .toggle-circle.on {
            background-color: #1db954;
            box-shadow: 0 0 8px rgba(29, 185, 84, 0.6);
        }

        /* Состояние OFF (красный) */
        .toggle-circle.off {
            background-color: #e53935;
            box-shadow: 0 0 8px rgba(229, 57, 53, 0.6);
        }

        /* Контейнер формы */
        .form-container {
            width: 500px; 
            position: relative; 
        }

        /* === ЗЕЛЕНАЯ ПЛАШКА === */
        .toast-notification {
            position: absolute;
            top: -34px; 
            left: 85px; 
            background-color: #1db954; 
            color: #ffffff;
            height: 67px;           
            padding: 0 13px 0 17px;        
            box-sizing: border-box; 
            border-radius: 15px;
            font-size: 18px;
            font-weight: 500;
            display: flex;
            align-items: center;    
            justify-content: center; 
            gap: 8px;
            z-index: 10; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            white-space: nowrap;
            overflow: hidden;       
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        /* Класс для скрытия плашки */
        .toast-notification.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .toast-notification svg {
            width: 30px;
            height: 30px;
            fill: white;
            flex-shrink: 0;         
        }

        /* Заголовок */
        .title {
            font-size: 32px;
            font-weight: 650;
            color: #000000;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            line-height: 38px;
        }

        /* Общие стили для полей ввода */
        .input-group {
            margin-bottom: 9px;
            position: relative;
        }

        .input-field {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            background-color: #f4f4f4;
            border: 1px solid transparent;
            border-radius: 12px;
            font-size: 16px;
            color: #000000;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field::placeholder {
            color: #999999;
            font-size: 16px;
        }

        /* Поле телефона */
        .phone-group .input-field {
            padding-right: 48px; 
            color: #999999;
            background-color: #fbfbfb;
        }

        /* Иконки */
        .icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-lock { fill: #adadad; }
        .icon-cross { fill: #adadad; }
        .icon-arrow { fill: none; stroke: #707070; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* Выпадающие списки */
        select.input-field {
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            color: #000;
            padding-right: 48px;
        }

        /* Поле примечания */
        .textarea-group .input-field {
            height: 80px;
            padding-top: 14px;
            resize: none;
        }

        /* Кнопка */
        .submit-btn {
            width: 100%;
            height: 55px;
            background-color: #fed42b;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            color: #000000;
            cursor: pointer;
            margin-top: 2px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #ebd11e;
        }

    </style>
</head>
<body>

<!-- Круглая кнопка-переключатель -->
<button class="toggle-circle on" id="toggleBtn" onclick="toggleToast()"></button>

<div class="form-container">
    
    <!-- ЗЕЛЕНАЯ ПЛАШКА -->
    <div class="toast-notification" id="successToast">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        Контакт успешно сохранен
    </div>

    <h1 class="title">OX CAPITAL</h1>

    <form>
        <!-- ФИО -->
        <div class="input-group">
            <input type="text" class="input-field" placeholder="ФИО">
        </div>

        <!-- Телефон -->
        <div class="input-group phone-group">
            <input type="tel" class="input-field" placeholder="+7 (964) 891-89-64" value="+7 (964) 891-89-64">
            <div class="icon icon-lock">
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </div>
        </div>

        <!-- Регион -->
        <div class="input-group">
            <input type="text" class="input-field" value="Москва и МО" style="padding-right: 48px;">
            <div class="icon icon-cross">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>
            </div>
        </div>

        <!-- Район -->
        <div class="input-group">
            <input type="text" class="input-field" placeholder="Район">
        </div>

        <!-- Бюджет -->
        <div class="input-group">
            <input type="text" class="input-field" placeholder="Бюджет">
        </div>

        <!-- Срок сдачи -->
        <div class="input-group">
            <select class="input-field">
                <option>Срок сдачи ЖК</option>
                <option>2024</option>
                <option>2025</option>
            </select>
            <div class="icon icon-arrow">
                <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            </div>
        </div>

        <!-- Комнатность -->
        <div class="input-group">
            <select class="input-field">
                <option>Комнатность</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
            </select>
            <div class="icon icon-arrow">
                <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
            </div>
        </div>

        <!-- Примечание -->
        <div class="input-group textarea-group">
            <textarea class="input-field" placeholder="Примечание"></textarea>
        </div>

        <!-- Кнопка -->
        <button type="button" class="submit-btn">Отправить</button>
    </form>

</div>

<script>
    function toggleToast() {
        const toast = document.getElementById('successToast');
        const btn = document.getElementById('toggleBtn');
        
        // Переключаем видимость плашки
        toast.classList.toggle('hidden');
        
        // Переключаем цвет кнопки
        if (toast.classList.contains('hidden')) {
            btn.classList.remove('on');
            btn.classList.add('off');
        } else {
            btn.classList.remove('off');
            btn.classList.add('on');
        }
    }
</script>

</body>
</html>
